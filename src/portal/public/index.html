<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>The shelf</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main>
    <header>
      <h1>The shelf</h1>
      <p class="lede">Free public-domain audiobooks. Add one and it is there for everybody.</p>
    </header>

    <form id="search" role="search">
      <fieldset class="kinds" hidden>
        <legend class="visually-hidden">What to look for</legend>
        <label><input type="radio" name="type" value="audiobook" checked> <span>Audiobooks</span></label>
        <label><input type="radio" name="type" value="ebook"> <span>Ebooks</span></label>
      </fieldset>
      <div class="catalog-line">
        <label for="q" class="visually-hidden">Title or author</label>
        <input id="q" name="q" type="search" placeholder="Title or author" autocomplete="off" enterkeyhint="search" required>
        <button type="submit">Search</button>
      </div>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <ol id="results" class="cards"></ol>

    <section aria-labelledby="shelf-heading">
      <h2 id="shelf-heading">On the shelf</h2>
      <p id="listen"></p>
      <ol id="shelf" class="cards"></ol>
    </section>

    <footer>
      <p>Audiobooks are LibriVox recordings from the Internet Archive. Everything here is in the public domain.</p>
    </footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
